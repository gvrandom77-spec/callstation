name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libsqlite3-dev libbz2-dev libmpdec-dev libffi-dev libtinfo5 build-essential ccache

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install --upgrade buildozer "cython<3.0"

    - name: Fix Android SDK paths for Buildozer
      run: |
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/tools/bin
        touch /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager

    - name: Run Buildozer
      run: |
        buildozer --debug android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: callstation-apk
        path: bin/*.apk
